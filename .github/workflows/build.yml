name: Build Android APK

on:
  push:
    branches: [main, master, integration-github, apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install "cython<3.0" buildozer
          python -m pip install git+https://github.com/kivy/python-for-android.git@master

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaifer-Android-APK
          path: bin/*.apk
          if-no-files-found: error
