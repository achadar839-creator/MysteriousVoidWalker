name: Build Android APK
on:
  push:
    branches: [main, master, apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install "cython<3.0" buildozer
          python -m pip install git+https://github.com/kivy/python-for-android.git@master

      - name: Accept Android SDK License (Official Kivy Method)
        run: |
          if [ ! -f "buildozer.spec" ]; then yes | buildozer init; fi
          # Kivy ka official tareeka: File me hi license bypass on kar do
          sed -i.bak "s/^#* *android.accept_sdk_license = .*/android.accept_sdk_license = True/" buildozer.spec
          echo "android.accept_sdk_license = True" >> buildozer.spec

      - name: Build APK
        run: buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidWalker-Android-APK
          path: bin/*.apk
          if-no-files-found: warn
