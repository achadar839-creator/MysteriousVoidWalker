name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Setup Legacy Tools Layout & Accept Licenses
      run: |
        # 1. Accept all licenses cleanly
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME --licenses || true
        
        # 2. Ensure build-tools and platforms exist
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;34.0.0" "platforms;android-34" "platform-tools"
        
        # 3. Fix Buildozer's legacy expectation (tools/bin/sdkmanager)
        mkdir -p "$ANDROID_HOME/tools/bin"
        ln -sf "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "$ANDROID_HOME/tools/bin/sdkmanager"
        
        # 4. Link system SDK directly into buildozer platform directory
        mkdir -p /home/runner/.buildozer/android/platform
        ln -sfn "$ANDROID_HOME" /home/runner/.buildozer/android/platform/android-sdk

    - name: Install Buildozer & Packaging Tools
      run: |
        python -m pip install --upgrade "pip<24.1" setuptools wheel
        pip install --upgrade "buildozer==1.5.0" "cython<3.0"
        pip install --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zaifer-AI-Debug-APK
        path: bin/*.apk
