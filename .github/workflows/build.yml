name: Build Android APK

on:
  push:
    branches: [main, master, integration-github, apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install "cython<3.0" buildozer
          python -m pip install git+https://github.com/kivy/python-for-android.git@master

            - name: Bootstrap Android SDK and Accept Licenses
        shell: bash
        run: |
          set -euxo pipefail

          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          buildozer android debug || true

          if [ ! -d "$ANDROID_HOME" ]; then
            echo "Android SDK directory was not created by buildozer."
            exit 1
          fi

          SDKMANAGER_PATH="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "sdkmanager not found under $ANDROID_HOME"
            find "$HOME/.buildozer/android" -maxdepth 5 -type f -name sdkmanager || true
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER_PATH"

          # Accept all licenses in a non-interactive, reliable way
          yes | "$SDKMANAGER_PATH" --licenses >/dev/null 2>&1 || true

          # Install required SDK packages
          "$SDKMANAGER_PATH" "platform-tools" "build-tools;37.0.0" "platforms;android-33" "platforms;android-34" >/dev/null 2>&1 || {
            echo "SDK package installation failed"
            exit 1
          }

          test -x "$ANDROID_HOME/build-tools/37.0.0/aidl"
      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaifer-Android-APK
          path: bin/*.apk
          if-no-files-found: error
