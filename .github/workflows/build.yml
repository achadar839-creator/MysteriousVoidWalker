name: Build Android APK

on:
  push:
    branches: [main, master, integration-github, apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install "cython<3.0" buildozer
          python -m pip install git+https://github.com/kivy/python-for-android.git@master

      - name: Bootstrap Android SDK and Accept Licenses
        run: |
          buildozer android debug || true
          SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$(find "$SDK_ROOT" -type f -name sdkmanager | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            find "$HOME/.buildozer/android" -maxdepth 5 -type f -name sdkmanager
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses
          yes | "$SDKMANAGER" "build-tools;37.0.0" "platform-tools"
          test -x "$SDK_ROOT/build-tools/37.0.0/aidl"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaifer-Android-APK
          path: bin/*.apk
          if-no-files-found: error
