name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: false

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev

    - name: Pre-accept Android Licenses & Link SDK to Buildozer
      run: |
        # 1. Licenses pre-approval without prompt
        mkdir -p "$ANDROID_HOME/licenses"
        echo -e "\n89337d12077e084b022a1118b24f7d73d692e647\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7df1a00b9793c4b2734f4da5a7f3" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
        
        # 2. Make sure build-tools 34.0.0 is present with AIDL
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_HOME "build-tools;34.0.0" "platforms;android-34" "platform-tools" || true
        
        # 3. Symlink system SDK directly to Buildozer's expected path
        mkdir -p /home/runner/.buildozer/android/platform
        ln -s "$ANDROID_HOME" /home/runner/.buildozer/android/platform/android-sdk

    - name: Install Buildozer & Packaging Tools
      run: |
        python -m pip install --upgrade "pip<24.1" setuptools wheel
        pip install --upgrade "buildozer==1.5.0" "cython<3.0"
        pip install --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zaifer-AI-Debug-APK
        path: bin/*.apk
