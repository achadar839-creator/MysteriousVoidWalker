name: Build Android APK
on:
  push:
    branches: [main, master, apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get -y install git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev automake libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install "cython<3.0" buildozer
          python -m pip install git+https://github.com/kivy/python-for-android.git@master

      - name: Fix API Versions in buildozer.spec
        run: |
          if [ ! -f "buildozer.spec" ]; then yes | buildozer init; fi
          # API 37 ko forcefully hata kar stable API 34 aur Build-tools 34 set kar rahe hain
          sed -i.bak "s/^#* *android.api = .*/android.api = 34/" buildozer.spec
          sed -i.bak "s/^#* *android.build_tools_version = .*/android.build_tools_version = 34.0.0/" buildozer.spec

      - name: Setup SDK and Accept Licenses DIRECTLY
        run: |
          # 1. Pehle Buildozer run karo taaki wo SDK download kare. License par use fail hone do (|| true lagaya hai taaki workflow na ruke)
          buildozer android debug || echo "SDK Downloaded. Proceeding to manual license acceptance..."
          
          # 2. Ab us downloaded sdkmanager ko dhundho
          SDKMANAGER=$(find ~/.buildozer/android/platform/android-sdk -name sdkmanager -type f -executable | head -n 1)
          echo "Found sdkmanager at: $SDKMANAGER"
          
          # 3. GitHub ki broken pipe wali security temporary band karke sidha license accept karo
          set +eo pipefail
          yes | "$SDKMANAGER" --licenses
          set -eo pipefail

      - name: Final APK Build
        run: buildozer android debug

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoidWalker-Android-APK
          path: bin/*.apk
          if-no-files-found: warn
