name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11 (Rock Solid Toolchain)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install System Dependencies & Java 17
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev \
          libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev openjdk-17-jdk

    - name: Install Pinned Buildozer & Packaging Tools
      run: |
        python -m pip install --upgrade "pip<24.1" setuptools wheel
        pip install --upgrade "buildozer==1.5.0" "cython<3.0"
        pip install --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zaifer-AI-Debug-APK
        path: bin/*.apk
