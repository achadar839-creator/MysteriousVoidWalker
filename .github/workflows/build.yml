name: Build Android APK
on:
  push:
    branches: [main, master, integration-github, apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install "cython<3.0" buildozer
          python -m pip install git+https://github.com/kivy/python-for-android.git@master

      - name: Initialize Buildozer (If missing)
        run: |
          if [ ! -f "buildozer.spec" ]; then
            echo "buildozer.spec nahi mila, naya bana raha hu..."
            yes | buildozer init
          fi

      - name: Accept Licenses & Install SDK
        run: |
          # Pehla run taaki Buildozer SDK download kar le
          buildozer android debug || echo "Buildozer SDK setup complete."
          
          # Sdkmanager dhundhna
          SDKMANAGER_PATH=$(find "$HOME/.buildozer/android" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER_PATH" ]; then
            echo "Error: sdkmanager nahi mila!"
            exit 1
          fi
          
          # Licenses accept karna (Bina pipefail ke)
          echo "Accepting licenses..."
          yes | "$SDKMANAGER_PATH" --licenses || true
          
          # Sahi API (34.0.0) install karna, Fake 37.0.0 nahi
          echo "Installing build-tools 34.0.0..."
          "$SDKMANAGER_PATH" "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true

      - name: Final Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoidWalker-Android-APK
          path: bin/*.apk
          if-no-files-found: warn
