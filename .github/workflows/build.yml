name: Build Android APK
on:
  push:
    branches: [main, master, integration-github, apk-build]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade "pip<24.1"
          python -m pip install "cython<3.0" buildozer
          python -m pip install git+https://github.com/kivy/python-for-android.git@master

      - name: Bootstrap Android SDK and Accept Licenses
        shell: bash
        run: |
          set -ex
          export ANDROID_HOME="$HOME/.buildozer/android/platform/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          
          echo "=== 1. Starting Buildozer Initial Setup ==="
          # Yahan || true rakha hai taaki buildozer ka initial run fail hone par script na ruke, lekin output dikhega
          buildozer android debug || echo "Buildozer initial run failed (Expected if SDK is missing), moving to manual setup..."
          
          if [ ! -d "$ANDROID_HOME" ]; then
            echo "ERROR: Android SDK directory was not created!"
            exit 1
          fi
          
          SDKMANAGER_PATH="$(find "$ANDROID_HOME" -type f -name sdkmanager | head -n 1)"
          echo "=== Found sdkmanager at: $SDKMANAGER_PATH ==="
          
          echo "=== 2. Accepting Licenses (Pura Output Dikhega) ==="
          set +e
          yes | "$SDKMANAGER_PATH" --licenses
          set -e
          
          echo "=== 3. Installing SDK Packages (Asli Error Yahan Dikhega) ==="
          # Yahan se >/dev/null hata diya hai taaki error log mein aaye
          "$SDKMANAGER_PATH" "platform-tools" "build-tools;37.0.0" "platforms;android-33" "platforms;android-34"
          
          echo "=== 4. Verifying Installation ==="
          test -x "$ANDROID_HOME/build-tools/37.0.0/aidl"

      - name: Build APK
        run: buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Zaifer-Android-APK
          path: bin/*.apk
          if-no-files-found: error
